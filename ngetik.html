<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balapan Ketik Angkasa - Belajar 10 Jari</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>

    <div id="starfield"></div>

    <div id="game-container">
        <header>
            <h1>🚀 SpaceType Racer</h1>
            <div class="stats">
                Waktu: <span id="time" style="color:#fff;">60</span>s | WPM: <span id="wpm-live" style="color:var(--accent-cyan);">0</span>
            </div>
        </header>

        <div class="track-board">
            <div class="lane-label">UFO Bot (Target WPM: 40)</div>
            <div class="lane">
                <div id="bot-ship" class="ship">🛸</div>
            </div>
            <div class="lane-label">Pesawat Kamu</div>
            <div class="lane">
                <div id="player-ship" class="ship">🚀</div>
            </div>
        </div>

        <div class="typing-box" id="typing-box">
            <div id="words"></div>
        </div>
        
        <p class="instructions">
            Tekan sembarang tombol untuk mulai. Gunakan <b>Spasi</b> untuk pindah kata. Latih 10 jari Anda!
        </p>

        <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>

    <div id="result-modal" class="hidden">
        <div class="modal-content">
            <h2>🏁 Misi Selesai! 🏁</h2>
            <div class="score-grid">
                <div class="score-item">
                    <div class="score-value" id="final-wpm">0</div>
                    <div class="score-label">WPM</div>
                </div>
                <div class="score-item">
                    <div class="score-value" id="final-accuracy">0%</div>
                    <div class="score-label">Akurasi</div>
                </div>
            </div>
            <p style="color:#aaa; font-size:1rem; margin-bottom: 25px;">
                Total Karakter Benar: <span id="correct-chars-count" style="color:#fff;">0</span>
            </p>
            <button class="btn-restart" id="btn-restart">🚀 Main Lagi</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
