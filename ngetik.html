<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balapan Ketik Angkasa - Belajar 10 Jari</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --text-main: #c5c6c7;
            --accent-cyan: #66fcf1;
            --accent-dark: #45a29e;
            --text-error: #ff4c4c;
            --track-bg: #1f2833;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Mencegah teks/elemen apa pun di layar (termasuk pesawat) bisa diblok/diseleksi/diklik secara tidak sengaja */
            user-select: none; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* Starfield Background */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.8;
            animation: moveStar linear infinite;
        }

        @keyframes moveStar {
            from { transform: translateY(-100vh); }
            to { transform: translateY(100vh); }
        }

        #game-container {
            width: 90%;
            max-width: 900px;
            z-index: 10;
            background: rgba(11, 12, 16, 0.85);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
            border: 1px solid var(--accent-dark);
            backdrop-filter: blur(5px);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--accent-dark);
            padding-bottom: 15px;
            pointer-events: none; /* Tidak bisa diklik */
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        .stats {
            font-size: 1.4rem;
            font-weight: bold;
        }

        /* Racing Track */
        .track-board {
            background: var(--track-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #333;
            pointer-events: none; /* Membuat seluruh kolom pesawat sama sekali tidak bisa diklik/diketik/diinteraksi */
        }

        .lane-label {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 5px;
        }

        .lane {
            height: 40px;
            background: #111;
            border-radius: 5px;
            margin-bottom: 15px;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .lane::after {
            content: "FINISH";
            position: absolute;
            right: 10px;
            color: #555;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .ship {
            font-size: 1.8rem;
            position: absolute;
            left: 0%;
            transition: left 0.3s ease-out;
            z-index: 2;
        }

        #player-ship {
            filter: drop-shadow(0 0 8px var(--accent-cyan));
        }

        #bot-ship {
            filter: drop-shadow(0 0 8px var(--text-error));
        }

        /* Typing Area */
        .typing-box {
            background: #1a1a1d;
            border-radius: 8px;
            padding: 20px;
            font-size: 1.8rem;
            line-height: 2.8rem;
            height: 120px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            cursor: text;
        }

        #words {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            position: relative;
        }

        .word {
            margin-right: 12px;
            display: inline-block;
            position: relative;
        }

        .char {
            color: #777;
            transition: color 0.1s;
        }

        .char.correct {
            color: var(--accent-cyan);
            text-shadow: 0 0 5px var(--accent-cyan);
        }

        .char.incorrect {
            color: var(--text-error);
            text-shadow: 0 0 5px var(--text-error);
            background: rgba(255, 76, 76, 0.2);
            border-radius: 2px;
        }

        .word.active {
            border-bottom: 2px solid var(--text-main);
        }

        #hidden-input {
            position: absolute;
            opacity: 0;
            top: -1000px;
        }

        /* Modal / Score Screen */
        #result-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }

        #result-modal.hidden {
            display: none;
        }

        .modal-content {
            background: var(--track-bg);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.3);
            width: 400px;
        }

        .modal-content h2 {
            color: var(--accent-cyan);
            margin-top: 0;
        }

        .score-grid {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }

        .score-item {
            background: #111;
            padding: 20px;
            border-radius: 10px;
            min-width: 100px;
            border: 1px solid #333;
        }

        .score-value {
            font-size: 3rem;
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .score-label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .btn-restart {
            background: transparent;
            color: var(--accent-cyan);
            border: 2px solid var(--accent-cyan);
            padding: 12px 25px;
            font-size: 1.2rem;
            font-family: inherit;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            pointer-events: auto; /* Tombol ini tetap bisa diklik */
        }

        .btn-restart:hover {
            background: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        .instructions {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 15px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="starfield"></div>

    <div id="game-container">
        <header>
            <h1>🚀 SpaceType Racer</h1>
            <div class="stats">
                Waktu: <span id="time" style="color:#fff;">60</span>s | WPM: <span id="wpm-live" style="color:var(--accent-cyan);">0</span>
            </div>
        </header>

        <div class="track-board">
            <div class="lane-label">UFO Bot (Target WPM: 40)</div>
            <div class="lane">
                <div id="bot-ship" class="ship">🛸</div>
            </div>
            <div class="lane-label">Pesawat Kamu</div>
            <div class="lane">
                <div id="player-ship" class="ship">🚀</div>
            </div>
        </div>

        <div class="typing-box" id="typing-box">
            <div id="words"></div>
        </div>
        
        <p class="instructions">
            Tekan sembarang tombol untuk mulai. Gunakan <b>Spasi</b> untuk pindah kata. Latih 10 jari Anda!
        </p>

        <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>

    <!-- Result Screen -->
    <div id="result-modal" class="hidden">
        <div class="modal-content">
            <h2>🏁 Misi Selesai! 🏁</h2>
            <div class="score-grid">
                <div class="score-item">
                    <div class="score-value" id="final-wpm">0</div>
                    <div class="score-label">WPM</div>
                </div>
                <div class="score-item">
                    <div class="score-value" id="final-accuracy">0%</div>
                    <div class="score-label">Akurasi</div>
                </div>
            </div>
            <p style="color:#aaa; font-size:1rem; margin-bottom: 25px;">
                Total Karakter Benar: <span id="correct-chars-count" style="color:#fff;">0</span>
            </p>
            <button class="btn-restart" onclick="initGame()">🚀 Main Lagi</button>
        </div>
    </div>

    <script>
        function createStars() {
            const container = document.getElementById('starfield');
            for(let i = 0; i < 50; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                let size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = (Math.random() * 2) + 's';
                container.appendChild(star);
            }
        }
        createStars();

        const kataIndo = [
            "saya", "kamu", "kita", "mereka", "pesawat", "luar", "angkasa", "bintang", "galaksi", 
            "roket", "cepat", "kilat", "meteor", "planet", "bulan", "matahari", "bumi", "orbit", 
            "komet", "astronot", "kosmos", "terbang", "balapan", "menang", "kalah", "juara", "waktu", 
            "mengetik", "jari", "belajar", "fokus", "tepat", "akurat", "langit", "hitam", "gelap", 
            "cahaya", "batu", "debu", "udara", "api", "mesin", "kecepatan", "super", "galaktik", 
            "nebula", "alien", "ufo", "laser", "radar", "sistem", "tata", "surya", "bima", "sakti", 
            "gravitasi", "vakum", "dimensi", "ruang", "kapsul", "stasiun", "satelit", "komunikasi", 
            "sinyal", "kontrol", "misi", "kapten", "pilot", "baju", "helm", "oksigen", "bahan", 
            "bakar", "kristal", "energi", "daya", "dorong", "lompat", "hiper", "navigasi", "koordinat", 
            "tujuan", "selamat", "bahaya", "sistem", "rusak", "perbaikan", "berhasil", "menuju"
        ];
        
        let timer = 60;
        let interval = null;
        let isPlaying = false;
        let charIndex = 0; 
        let wordIndex = 0;
        let correctChars = 0;
        let totalKeystrokes = 0;
        
        const wordsDiv = document.getElementById('words');
        const input = document.getElementById('hidden-input');
        const timeDisplay = document.getElementById('time');
        const wpmDisplay = document.getElementById('wpm-live');
        const playerShip = document.getElementById('player-ship');
        const botShip = document.getElementById('bot-ship');
        const modal = document.getElementById('result-modal');
        const typingBox = document.getElementById('typing-box');

        function initGame() {
            timer = 60;
            isPlaying = false;
            clearInterval(interval);
            correctChars = 0;
            totalKeystrokes = 0;
            wordIndex = 0;
            charIndex = 0;
            
            timeDisplay.innerText = timer;
            wpmDisplay.innerText = 0;
            playerShip.style.left = '0%';
            botShip.style.left = '0%';
            modal.classList.add('hidden');
            
            input.disabled = false;
            input.value = '';
            input.focus();
            
            generateWords();
        }

        function generateWords() {
            wordsDiv.innerHTML = '';
            let shuffled = [...kataIndo].sort(() => 0.5 - Math.random());
            let wordPool = [];
            while(wordPool.length < 150) {
                wordPool = wordPool.concat(shuffled.sort(() => 0.5 - Math.random()));
            }
            
            wordPool.slice(0, 150).forEach((word) => {
                let wordSpan = document.createElement('div');
                wordSpan.classList.add('word');
                word.split('').forEach(char => {
                    let charSpan = document.createElement('span');
                    charSpan.classList.add('char');
                    charSpan.innerText = char;
                    wordSpan.appendChild(charSpan);
                });
                wordsDiv.appendChild(wordSpan);
            });
            
            wordsDiv.childNodes[0].classList.add('active');
        }

        typingBox.addEventListener('click', () => input.focus());
        document.addEventListener('keydown', () => input.focus());

        input.addEventListener('input', (e) => {
            if(!isPlaying) {
                startTimer();
            }
            
            const currentWord = wordsDiv.childNodes[wordIndex];
            const chars = currentWord.childNodes;
            const typedVal = input.value;
            const typedChar = typedVal[typedVal.length - 1];
            
            if(typedVal.length < charIndex) {
                charIndex--;
                if(charIndex < 0) charIndex = 0;
                chars[charIndex].classList.remove('correct', 'incorrect');
                return;
            }

            if(typedChar === ' ') {
                if(charIndex > 0) {
                    currentWord.classList.remove('active');
                    
                    for(let i = charIndex; i < chars.length; i++) {
                        chars[i].classList.add('incorrect');
                    }
                    
                    wordIndex++;
                    charIndex = 0;
                    wordsDiv.childNodes[wordIndex].classList.add('active');
                    input.value = '';
                    
                    scrollWords();
                } else {
                    input.value = '';
                }
                return;
            }

            if(charIndex < chars.length) {
                totalKeystrokes++;
                const expectedChar = chars[charIndex].innerText;
                
                if(typedChar === expectedChar) {
                    chars[charIndex].classList.add('correct');
                    correctChars++;
                } else {
                    chars[charIndex].classList.add('incorrect');
                }
                
                charIndex++;
                updateStats();
            } else {
                input.value = input.value.slice(0, -1);
            }
        });

        function scrollWords() {
            const activeWord = wordsDiv.childNodes[wordIndex];
            const activeTop = activeWord.offsetTop;
            
            let wordsToHide = [];
            
            for (let i = 0; i < wordIndex; i++) {
                let word = wordsDiv.childNodes[i];
                if (word.offsetTop < activeTop && word.style.display !== 'none') {
                    wordsToHide.push(word);
                }
            }
            
            wordsToHide.forEach(word => {
                word.style.display = 'none';
            });
        }

        function startTimer() {
            isPlaying = true;
            interval = setInterval(() => {
                timer--;
                timeDisplay.innerText = timer;
                
                let timeElapsed = 60 - timer;
                let maxTrackWPM = 100;
                let botPercent = (timeElapsed / 60) * (40 / maxTrackWPM) * 100;
                botShip.style.left = Math.min(botPercent, 90) + '%';
                
                if(timer <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateStats() {
            let timeElapsed = 60 - timer;
            let currentWPM = 0;
            if(timeElapsed > 0) {
                currentWPM = Math.round((correctChars / 5) / (timeElapsed / 60));
            }
            wpmDisplay.innerText = currentWPM;
            
            let maxTrackWPM = 100;
            let wpmEquiv = (correctChars / 5);
            let playerPercent = (wpmEquiv / maxTrackWPM) * 100;
            
            playerShip.style.left = Math.min(playerPercent, 90) + '%';
        }

        function endGame() {
            clearInterval(interval);
            isPlaying = false;
            input.disabled = true;
            
            let finalWpm = Math.round(correctChars / 5);
            let accuracy = totalKeystrokes > 0 ? Math.round((correctChars / totalKeystrokes) * 100) : 0;
            
            document.getElementById('final-wpm').innerText = finalWpm;
            document.getElementById('final-accuracy').innerText = accuracy + '%';
            document.getElementById('correct-chars-count').innerText = correctChars;
            
            modal.classList.remove('hidden');
        }

        window.onload = initGame;
    </script>
</body>
</html>
